services:
  - type: web
    name: ai-validation-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: PORT
        value: "10000"
      - key: MONGODB_URL
        sync: false          # set manually in Render dashboard
      - key: MONGODB_DB
        value: ai_validator
      - key: AI_API_KEY
        sync: false          # set manually in Render dashboard
      - key: AI_API_URL
        value: https://api.openai.com/v1/chat/completions
      - key: AI_MODEL
        value: gpt-3.5-turbo
      - key: CHROMA_DB_PATH
        value: ./data/chroma_db
      - key: EMBEDDING_MODEL
        value: all-MiniLM-L6-v2
      - key: ALLOWED_ORIGIN
        sync: false          # set to your Vercel URL e.g. https://your-app.vercel.app
    healthCheckPath: /api/health
